name: Verify module

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installer package
        shell: pwsh
        run: ./build.ps1
      - name: Verify generated archive
        shell: pwsh
        run: ./tests/verify-package.ps1 ./dist/latvijas-pasts-parcel-lockers-opencart3-1.0.0.ocmod.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          ./dist/latvijas-pasts-parcel-lockers-opencart3-1.0.0.ocmod.zip
          --verify-tag
          --title "Latvijas Pasts Parcel Lockers for OpenCart 3 ${{ github.ref_name }}"
          --generate-notes
